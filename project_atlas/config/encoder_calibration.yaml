# Project ATLAS encoder calibration
# Wheels were lifted. Physical mapping was visually verified on 2026-08-04.
# Commissioned encoder counts per wheel revolution. These values are the
# single source shared with yahboom_base.py after measured ground validation.
encoder_calibration:
  wheelbase_m: 0.367
  wheel_diameter_m: 0.125
  wheel_circumference_m: 0.392699
  wheel_source: https://www.amrobotics.in/products/125mm-heavy-duty-high-density-rc-rubber-wheel-with-flange-for-6mm-shaft-motors
  motors:
    m1:
      position: front_right
      counts_per_revolution: 4048.7
      confidence: commissioned
      method: measured_ground_calibration
    m2:
      position: front_left
      counts_per_revolution: 3300.6
      confidence: commissioned
      method: measured_ground_calibration
    m3:
      position: back_right
      counts_per_revolution: 4080.1
      confidence: commissioned
      method: measured_ground_calibration
    m4:
      position: back_left
      counts_per_revolution: 2697.8
      confidence: commissioned
      method: measured_ground_calibration
