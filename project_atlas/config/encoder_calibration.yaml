# Project ATLAS encoder calibration
# Physical controller mapping was reverified on 2026-09-17/21.
# This is the single source for physical position, forward sign and retained
# counts/revolution used by both yahboom_base.py and drive_pid.yaml. The numeric
# CPR values predate final motor replacement and require per-wheel ground
# revalidation; retaining them here is not a renewed commissioning claim.
encoder_calibration:
  wheelbase_m: 0.367
  wheel_diameter_m: 0.125
  wheel_circumference_m: 0.392699
  wheel_source: https://www.amrobotics.in/products/125mm-heavy-duty-high-density-rc-rubber-wheel-with-flange-for-6mm-shaft-motors
  motors:
    m1:
      position: rear_left
      # Combined clean 20 cm forward and ~70 cm reverse evidence.
      encoder_sign: 1.0
      counts_per_revolution: 2238.4
      confidence: measured_provisional
      method: measured_20cm_forward_plus_70cm_reverse
    m2:
      position: rear_right
      # Combined clean 20 cm forward and ~70 cm reverse evidence.
      encoder_sign: -1.0
      counts_per_revolution: 2215.0
      confidence: measured_provisional
      method: measured_20cm_forward_plus_70cm_reverse
    m3:
      position: front_left
      encoder_sign: 1.0
      counts_per_revolution: 2199.1
      confidence: intermittent_measured_provisional
      method: measured_when_coherent_70cm_reverse_dynamic_candidate
    m4:
      position: front_right
      # 2026-09-25 measured forward run: raw count decreased by 869 and tracked
      # M4 tracked M1/M2 in the clean 20 cm run but was weak later; dynamic
      # consensus rejects it only during incoherent intervals.
      encoder_sign: -1.0
      counts_per_revolution: 2230.5
      confidence: intermittent_measured_provisional
      method: measured_when_coherent_20cm_forward_dynamic_candidate
