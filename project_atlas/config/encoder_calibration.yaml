# Project ATLAS encoder calibration
# Physical controller mapping was reverified on 2026-09-17/21.
# This is the single source for physical position, forward sign and retained
# counts/revolution used by both yahboom_base.py and drive_pid.yaml. The numeric
# CPR values predate final motor replacement and require per-wheel ground
# revalidation; retaining them here is not a renewed commissioning claim.
encoder_calibration:
  wheelbase_m: 0.367
  wheel_diameter_m: 0.125
  wheel_circumference_m: 0.392699
  wheel_source: https://www.amrobotics.in/products/125mm-heavy-duty-high-density-rc-rubber-wheel-with-flange-for-6mm-shaft-motors
  motors:
    m1:
      position: rear_left
      # 2026-09-25 measured forward run: raw count increased by 926.
      encoder_sign: 1.0
      counts_per_revolution: 4048.7
      confidence: revalidation_required
      method: retained_pre_motor_replacement_ground_calibration
    m2:
      position: rear_right
      # 2026-09-25 measured forward run: raw count decreased by 931.
      encoder_sign: -1.0
      counts_per_revolution: 3300.6
      confidence: revalidation_required
      method: retained_pre_motor_replacement_ground_calibration
    m3:
      position: front_left
      encoder_sign: 1.0
      counts_per_revolution: 4080.1
      confidence: unvalidated_excluded
      method: weak_feedback_162_counts_during_20cm_ground_run
    m4:
      position: front_right
      # 2026-09-25 measured forward run: raw count decreased by 869 and tracked
      # M1/M2 closely, so M4 replaces weak M3 in the selected feedback set.
      encoder_sign: -1.0
      counts_per_revolution: 2697.8
      confidence: revalidation_required
      method: measured_forward_ground_response_selected_for_revalidation
