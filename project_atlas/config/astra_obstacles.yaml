# Track A (STAGED, inactive): Astra depth -> virtual obstacle scan for Nav2.
# Mount provenance: docs/TRACK_A_G2_MEASUREMENTS.md (owner instruction 2026-11-06: use these values, no new
# measurements). Reference point: axle midpoint on the floor (owner-confirmed). Launch/preflight refuse on null.
# Calibration: FACTORY / driver CameraInfo at runtime (no calibration file); see docs/TRACK_A_FACTORY_CALIBRATION.md.

mount:                      # base_link -> astra_depth_optical_frame (ROS REP-103: x forward, y left, z up)
  x_m: 0.13                 # CANDIDATE (derived, not directly measured): front edge +0.25 minus lens 0.12 behind
                            #   it (owner tape 0.79-0.67 m). Box test 2026-11-11 suggests it is off; change PENDING
                            #   owner verification of lens->bumper offset (see TRACK_A_TEST_REPORT)
  y_m: 0.0                  # PRIOR: owner '~0 by eye' (before the 26 Oct remount). Uncertainty ~+-0.03 m
  z_m: 0.30                 # G2 owner, ruler, IR lens height after remount (issue #12, 26 Oct 2026 22:48 IST)
  pitch_deg: 0.0            # OWNER RE-LEVELLED 2026-11-11 to 0; far-wall lean measured -0.3 deg (+-1). Before the
                            #   re-level the camera pointed ~8-9 deg UP (box top, wall lean, wall base all agreed)
  yaw_deg: 0.0              # facing straight ahead

astra:
  depth_width: 160          # must match the runtime CameraInfo the node validates
  depth_height: 120
  depth_fps: 15             # half the viewer's 30 fps: enough for 0.3 m/s driving, half the load

obstacle_scan:              # atlas_astra_obstacle_scan.py, evaluated in base_link
  target_frame: base_link
  min_height_m: 0.04        # ignore floor (and ~4 cm floor noise) ...
  floor_margin_deg: 1.0     # ... plus range * tan(1.0 deg): absorbs up to ~1 deg unmeasured nose-down pitch error
                            #   (else the far floor becomes phantom obstacles). Cut: 5.7 cm at 1 m, 9.2 cm at 3 m
  max_height_m: 1.0         # ENGINEERING BOUND, NOT a rover height (never recorded). Recorded LiDAR scan plane is
                            #   0.40 m; 1.0 m sits well above any plausible ATLAS top, so overhangs the rover could
                            #   hit are kept (fails safe: may also mark things it could pass under). Ceilings ignored
  angle_min_rad: -0.52      # about +-30 deg; Astra horizontal FOV is about 58 deg
  angle_max_rad: 0.52
  angle_increment_rad: 0.0087
  range_min_m: 0.35         # Astra depth is unreliable closer than ~0.4 m
  range_max_m: 3.0          # beyond ~3 m depth noise grows; LiDAR covers far range
  stale_s: 0.5              # frames older than this are never published
  min_valid_fraction: 0.3   # <30 % valid depth pixels (blinded/covered/too close): publish nothing
  max_rate_hz: 10.0         # processing cap; extra frames dropped, never queued

bridge:
  from_domain: 77           # Astra private domain (keeps camera graph off the production domain)
  to_domain: 0
  topic: /astra/obstacle_scan
