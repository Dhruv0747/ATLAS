/**:
  ros__parameters:
    robot_base_frame: base_link
    return_to_init: false
    costmap_topic: /map
    costmap_updates_topic: /map_updates
    visualize: true
    planner_frequency: 0.50
    progress_timeout: 30.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.5
    # Accept short doorway/frontier segments in tight indoor maps. This changes
    # only frontier discovery; Nav2 still enforces the full rover footprint.
    min_frontier_size: 0.10
    # A goal closer than this is already inside Nav2's practical arrival area.
    # Skip it and select a meaningful frontier farther into unknown space.
    # Do not churn through tiny goals within ATLAS's own maneuvering envelope.
    min_goal_distance: 0.30
