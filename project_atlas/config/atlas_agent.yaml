atlas_agent_supervisor:
  ros__parameters:
    enabled: true
    # Commission in monitor-only mode. Enabling execution still leaves the
    # explicit confirmation and deterministic preflight gates active.
    execution_enabled: false
    llm_enabled: true
    require_confirmation: true
    confirmation_timeout_s: 60.0
    state_timeout_s: 3.0
    verification_timeout_s: 12.0
    minimum_battery_percent: 20.0
    model: gpt-4o-mini
