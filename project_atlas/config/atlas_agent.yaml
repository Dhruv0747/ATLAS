atlas_agent_supervisor:
  ros__parameters:
    enabled: true
    # Active supervised mode: the agent may dispatch only allowlisted tools.
    # Motion still requires explicit confirmation and deterministic preflight
    # checks for localization, sensors, battery, and safety state.
    execution_enabled: true
    llm_enabled: true
    require_confirmation: true
    confirmation_timeout_s: 60.0
    state_timeout_s: 3.0
    verification_timeout_s: 12.0
    minimum_battery_percent: 20.0
    model: gpt-4o-mini
