teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: false
    enable_button: 4
    enable_turbo_button: 5
    axis_linear:
      x: 1
    scale_linear:
      x: 0.75
    scale_linear_turbo:
      x: 1.0
    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 1.6
    scale_angular_turbo:
      yaw: 1.6
    inverted_reverse: false
