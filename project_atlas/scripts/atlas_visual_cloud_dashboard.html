<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS Visual Cloud</title><style>
:root{--bg:#020711;--card:#071426;--line:#17405e;--cyan:#19c9ff;--green:#55e878;--amber:#ffc857;--red:#ff5364;--text:#e7f7ff;--dim:#83a7bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0b2843,#020711 42%);color:var(--text);font:14px system-ui}header{height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#020711e8;z-index:3}h1{font-size:20px;letter-spacing:2px;margin:0}.status{margin-left:auto;color:var(--green)}main{padding:14px;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.card{background:linear-gradient(145deg,#07182a,#040c18);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:0 10px 35px #0008}.wide{grid-column:1/-1}.title{color:var(--cyan);letter-spacing:1px;font-weight:700;margin-bottom:10px}.pipeline{display:flex;align-items:center;overflow:auto;padding:18px 4px}.node{min-width:130px;text-align:center;border:1px solid #246188;border-radius:9px;padding:12px;background:#081b2e}.edge{min-width:110px;text-align:center;color:var(--dim);position:relative}.edge:after{content:'▶';color:var(--cyan);padding-left:6px}.edge.HEALTHY:after{color:var(--green);animation:pulse .8s infinite}.edge.DELAYED:after{color:var(--amber)}.edge.STOPPED:after{color:var(--red)}@keyframes pulse{50%{opacity:.25}}.metric{font-size:12px;color:var(--dim)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{padding:10px;border:1px solid var(--line);border-radius:8px}.kpi b{font-size:20px;color:var(--cyan)}canvas{width:100%;height:410px;background:#020914;border-radius:8px}.scroll{max-height:410px;overflow:auto}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:7px;border-bottom:1px solid #102b40}.HEALTHY{color:var(--green)}.DELAYED{color:var(--amber)}.STOPPED{color:var(--red)}@media(max-width:900px){main{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>△ PROJECT ATLAS · VISUAL CLOUD</h1><span>OBSERVABILITY ONLY</span><span id=link class=status>CONNECTING</span></header><main>
<section class="card wide"><div class=title>SENSOR → LOCALIZATION → PLANNING → CONTROL → HARDWARE</div><div id=pipe1 class=pipeline></div><div id=pipe2 class=pipeline></div></section>
<section class=card><div class=title>LIVE NAVIGATION</div><canvas id=map width=900 height=500></canvas></section>
<section class=card><div class=title>ROBOT / MISSION</div><div id=kpis class=grid></div><div class=title style="margin-top:16px">BREAK LOCATION</div><div id=breakdown></div></section>
<section class="card wide"><div class=title>LIVE ROS TOPIC TRAFFIC</div><div class=scroll id=topics></div></section>
<section class=card><div class=title>ROS GRAPH</div><div id=graph class=scroll></div></section><section class=card><div class=title>TF / SERVICES / ACTIONS</div><div id=tf class=scroll></div></section><section class="card wide"><div class=title>MISSION HISTORY / ROSBAG EVIDENCE</div><div id=missions class=scroll></div></section>
</main><script>
const $=id=>document.getElementById(id), health=t=>t?.health||'STOPPED', stat=(s,t)=>{let x=s.traffic?.[t]||{};return `${x.hz||0} Hz · ${x.age_s==null?'never':x.age_s+' s'}`};
function pipeline(id,nodes,topics,s){let h='';nodes.forEach((n,i)=>{h+=`<div class=node>${n}</div>`;if(i<topics.length){let t=topics[i],x=health(s.traffic?.[t]);h+=`<div class="edge ${x}"><b>${t}</b><br><span class=metric>${stat(s,t)} · ${x}</span></div>`}});$(id).innerHTML=h}
function draw(s){let c=$('map'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#123a55';for(let i=0;i<c.width;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=0;i<c.height;i+=50){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}function grid(t,color){let g=s.traffic?.[t]?.value;if(!g?.cells)return;x.fillStyle=color;g.cells.forEach((row,j)=>row.forEach((v,i)=>{if(v>60)x.fillRect(450+(g.origin_x+i*g.resolution*g.stride)*70,250-(g.origin_y+j*g.resolution*g.stride)*70,Math.max(1,g.resolution*g.stride*70),Math.max(1,g.resolution*g.stride*70))}))}grid('/map','#31485c');grid('/global_costmap/costmap','#723f3655');grid('/local_costmap/costmap','#ff794f66');let path=s.traffic?.['/plan']?.value?.points||[];x.strokeStyle='#19c9ff';x.lineWidth=3;x.beginPath();path.forEach((p,i)=>{let a=450+p[0]*70,b=250-p[1]*70;i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke();let p=s.traffic?.['/odom']?.value||{};x.fillStyle='#55e878';x.beginPath();x.arc(450+(p.x||0)*70,250-(p.y||0)*70,10,0,7);x.fill();let scan=s.traffic?.['/scan']?.value||{},rs=scan.ranges||[];x.fillStyle='#4faeff';rs.forEach((r,i)=>{if(!r)return;let a=(scan.angle_min||0)+i*(scan.angle_increment||0),px=(p.x||0)+r*Math.cos(a),py=(p.y||0)+r*Math.sin(a);x.fillRect(450+px*70,250-py*70,2,2)})}
function render(s){$('link').textContent=`LIVE · ${s.robot_id}`;pipeline('pipe1',['LiDAR','Costmap','Planner','Controller','Command Mux','Motor Driver'],['/scan','/scan','/plan','/cmd_vel_nav','/cmd_vel'],s);pipeline('pipe2',['Encoders','Wheel Odom','EKF','AMCL','Nav2'],['/yahboom/odom','/yahboom/odom','/odom','/amcl_pose'],s);let sys=s.system||{},mission=s.traffic?.['/atlas/mission_status']?.value||'--';$('kpis').innerHTML=[["CPU LOAD",sys.load?.[0]??'--'],["RAM",(sys.ram_used_pct??'--')+'%'],["TEMP",(sys.temperature_c??'--')+'°C'],["FAILURE",s.failure_class||'NONE'],["GIT",(s.git_version||'').slice(0,10)],["NODES",s.graph?.nodes?.length||0],["TOPICS",s.graph?.topics?.length||0],["MISSION",mission]].map(v=>`<div class=kpi><span>${v[0]}</span><br><b>${v[1]}</b></div>`).join('');$('breakdown').innerHTML=Object.entries(s.traffic||{}).filter(([k,v])=>v.health!=='HEALTHY').map(([k,v])=>`<p class=${v.health}>${k}: ${v.health} (${v.age_s==null?'never':v.age_s+' s'})</p>`).join('')||'<p class=HEALTHY>All monitored links healthy</p>';let gt=Object.fromEntries((s.graph?.topics||[]).map(t=>[t.name,t]));$('topics').innerHTML='<div class=row><b>TOPIC / ENDPOINTS</b><b>HZ</b><b>AGE</b><b>STATE</b></div>'+Object.entries(s.traffic||{}).map(([k,v])=>{let g=gt[k]||{};return `<div class=row><span>${k}<br><small>pub: ${(g.publishers||[]).join(', ')||'--'}<br>sub: ${(g.subscribers||[]).join(', ')||'--'}</small></span><span>${v.hz}</span><span>${v.age_s??'--'}</span><b class=${v.health}>${v.health}</b></div>`}).join('');$('graph').innerHTML=(s.graph?.nodes||[]).map(n=>`<div>${n}</div>`).join('');let transforms=s.traffic?.['/tf']?.value?.transforms||[];$('tf').innerHTML='<b>TF</b>'+transforms.map(t=>`<div>${t.parent} → ${t.child}</div>`).join('')+`<p><b>Services:</b> ${s.graph?.services?.length||0}</p><p><b>Actions:</b> ${(s.graph?.actions||[]).join(', ')||'none'}</p>`;let e=s.mission_evidence||{};$('missions').innerHTML=(e.missions||[]).map(m=>`<div class=row><span>${new Date((m.at||0)*1000).toLocaleString()} · ${m.status||m.error||'--'}</span><b>${m.outcome||'--'}</b><b>${m.failure_class||'--'}</b><span></span></div>`).join('')+'<hr>'+(e.bags||[]).map(b=>`<div>${b.name}<br><small>${b.path}</small></div>`).join('');draw(s)}
async function tick(){try{let a=await fetch('/api/v1/robots').then(r=>r.json());if(a.length)render(a[0]);else $('link').textContent='WAITING FOR JETSON'}catch(e){$('link').textContent='CLOUD API OFFLINE'}setTimeout(tick,1000)}tick();
</script></body></html>
