# 2026-11-15 owner decision ("Yes, switch and test"): RPLIDAR A1 scan mode Boost -> Sensitivity (same 8 kHz, same
# 1080 samples at ~7.3 Hz). Parked service test: no-echo 9.0 % -> 6.8 %, gap runs >= 13 deg 1.5 -> 0.2 per scan.
# Rollback: delete this file, systemctl --user daemon-reload, restart atlas-lidar (parked, E-STOP latched).
[Service]
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/humble/setup.bash; exec ros2 run rplidar_ros rplidar_composition --ros-args -r scan:=scan_raw -p serial_port:=/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0 -p serial_baudrate:=115200 -p frame_id:=laser_frame -p angle_compensate:=true -p scan_mode:=Sensitivity'
