# PROPOSED (not installed). Bounds the RPLIDAR start retry loop.
# Evidence 2026-10-10: 6 of the last 10 boots needed 10-21 failed starts
# (SL_RESULT_OPERATION_TIMEOUT, then health OK + "Can not start scan
# 80008002") before scanning, ~3 min after boot. With RestartSec=5 the default
# 5-starts-per-10-s limit can never trip, so the loop was unbounded.
# 40 starts per 15 min is ~2x the worst observed boot; after that the unit
# stays failed and atlas-sensor-recovery reports HARDWARE ATTENTION.
# Install: cp to ~/.config/systemd/user/atlas-lidar.service.d/ ; systemctl --user daemon-reload
# Rollback: delete the file ; systemctl --user daemon-reload
[Unit]
StartLimitIntervalSec=900
StartLimitBurst=40

[Service]
RestartSec=5
