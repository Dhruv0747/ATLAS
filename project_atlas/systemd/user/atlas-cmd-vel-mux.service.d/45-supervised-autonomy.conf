# 2026-11-15 owner decision ("Yes, open it"): allow supervised autonomy (NAV commands) through the mux.
# Overrides 40-manual-commissioning.conf (ATLAS_MANUAL_ONLY=1). Everything else is unchanged: the latched software
# E-STOP (starts latched), remote override, encoder autonomy_ready gate (CRITICAL = stop), camera-obstacle gate in
# mission control, 0.5 speed scale. Rollback: delete this file, systemctl --user daemon-reload, restart the mux.
[Service]
Environment=ATLAS_MANUAL_ONLY=0
