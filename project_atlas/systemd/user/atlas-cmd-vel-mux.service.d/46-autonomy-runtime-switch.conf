# 2026-11-15 dashboard AUTONOMY ON/OFF (owner request). Keeps 40-manual-commissioning (ATLAS_MANUAL_ONLY=1) as the
# boot default and lets the operator lift it at runtime via /atlas/autonomy/arm (dashboard, PIN). Arming is refused
# unless the E-STOP is latched, the rover is still, encoders are autonomy-ready and config/autonomy_gate.yaml has
# speed_validated: true. Any new E-STOP latch or a mux restart turns autonomy OFF.
# Rollback: delete this file, systemctl --user daemon-reload, restart atlas-cmd-vel-mux (parked, E-STOP latched).
[Service]
Environment=ATLAS_AUTONOMY_RUNTIME_ARM=1
