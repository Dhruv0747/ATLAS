# 2026-11-15 (owner: "you do the test"): the base runs closed-loop speed control (config/speed_loop.yaml enabled), so
# the mux no longer halves COMMISSION/NAV2/RECOVERY speed while encoders are DEGRADED. CRITICAL still stops.
# Rollback: delete this file, systemctl --user daemon-reload, restart atlas-cmd-vel-mux (parked, E-STOP latched).
[Service]
Environment=ATLAS_SPEED_LOOP_CLOSED=1
