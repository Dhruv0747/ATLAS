[Service]
# 2026-11-20 owner: enable the UNO left (D4/D5) and right (D6/D7) HC-SR04 channels for checking.
# Readings only: the LiDAR guard uses them only after config/ultrasonic_mounts.json has measured, enabled mounts.
Environment=ATLAS_LEFT_ULTRASONIC_ENABLED=1
Environment=ATLAS_RIGHT_ULTRASONIC_ENABLED=1
Environment=ATLAS_ULTRASONIC_SWAP_LR=1
# 2026-11-20 owner: the D4/D5 channel is on the physical RIGHT and D6/D7 on the physical LEFT; ROS outputs are swapped.
