# 2026-11-14 (owner: "Yes, fix it"): the feature manager pauses this unit during mapping; the bridge stops with it
# (BindsTo) and was never started again. Every (re)start of the Astra unit now queues the safe starter, which waits
# for parked-twice + CPU < 72 % before starting the bridge. "-" = never fail the Astra unit because of this.
[Service]
ExecStartPost=-/usr/bin/systemctl --user --no-block start atlas-astra-bridge-starter.service
