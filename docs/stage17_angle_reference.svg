<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <rect width="210" height="297" fill="white"/>
  <g fill="#111" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="105" y="18" font-size="6">ATLAS STAGE 17 — CAMERA REFERENCE</text>
    <text x="105" y="28" font-size="4">Print at 100%. Check the 150 mm square with a ruler.</text>
    <text x="105" y="36" font-size="4">Place in the measured wheel-axis plane; mark rover FRONT.</text>
  </g>
  <path d="M30 70 H180 V220 H30 Z" fill="none" stroke="black" stroke-width=".6"/>
  <g stroke="#888" stroke-width=".2">
    <path d="M60 70 V220 M90 70 V220 M120 70 V220 M150 70 V220"/>
    <path d="M30 100 H180 M30 130 H180 M30 160 H180 M30 190 H180"/>
  </g>
  <g fill="black"><circle cx="180" cy="220" r="2"/><circle cx="180" cy="70" r="2"/>
    <circle cx="30" cy="70" r="2"/><circle cx="30" cy="220" r="2"/></g>
  <g font-family="Arial,sans-serif" font-size="4" fill="black">
    <text x="156" y="231">A (0, 0)</text><text x="158" y="62">B (.15, 0)</text>
    <text x="20" y="62">C (.15, .15)</text><text x="20" y="231">D (0, .15)</text>
  </g>
  <path d="M105 167 V102 L101 110 M105 102 L109 110" fill="none" stroke="black" stroke-width="1"/>
  <path d="M105 167 H61 L69 163 M61 167 L69 171" fill="none" stroke="black" stroke-width="1"/>
  <g font-family="Arial,sans-serif" font-size="4" fill="black" text-anchor="middle">
    <text x="105" y="95">+X / FRONT</text><text x="63" y="180">+Y / LEFT</text>
    <text x="105" y="248">Coordinates are metres; left wheel angle is positive.</text>
    <text x="105" y="258">Record both tyres and a directed chassis-forward reference.</text>
    <text x="105" y="268">Visual estimates have uncertainty. This sheet is not a sensor.</text>
  </g>
</svg>
