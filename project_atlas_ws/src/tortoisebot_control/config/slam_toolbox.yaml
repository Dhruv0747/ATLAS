slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function_type: NONE
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    transform_publish_period: 0.05
    map_update_interval: 2.0
    max_laser_range: 12.0
    minimum_time_interval: 0.06
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    # The RPLIDAR scan matcher produced metre-scale corrections during short
    # indoor moves.  EKF wheel/IMU odometry is the stable pose source; LiDAR
    # remains fully active for map construction and Nav2 obstacle costmaps.
    use_scan_matching: false
    do_loop_closing: false
    resolution: 0.05
