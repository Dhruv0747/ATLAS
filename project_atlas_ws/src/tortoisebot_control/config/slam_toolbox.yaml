slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function_type: NONE
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    transform_publish_period: 0.05
    map_update_interval: 2.0
    max_laser_range: 12.0
    minimum_time_interval: 0.06
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    # Mapping must correct accumulated wheel/IMU drift from LiDAR geometry.
    # Disabling these produced duplicated/ghost walls and made AMCL converge
    # to different poses while ATLAS was stationary.
    use_scan_matching: true
    do_loop_closing: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.10
    scan_queue_size: 20
    resolution: 0.05
